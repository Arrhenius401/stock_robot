[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-robot"
version = "0.1.0"
description = "AI-powered stock analysis report assistant"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "akshare>=1.14",
    "pandas>=2.0",
    "jinja2>=3.1",
    "vectorbt>=1.1,<2",
    "plotly<7",  # vectorbt 1.1.0 与 plotly 7 不兼容，固化 6.x 约束
    "openai>=1.0",
    "anthropic>=0.30",
    "chromadb>=0.5",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain-openai>=0.2",
    "langchain-anthropic>=0.2",
    "apscheduler>=3.10",
    "markdown>=3.5",
    "filelock>=3.0",
]

[project.scripts]
stock-robot = "stock_robot.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "pytest-asyncio>=1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.pyright]
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
include = ["src", "tests"]

[tool.ruff]
target-version = "py311"

# 第三方数据源适配层：akshare/requests/pandas 异常类型不可预测，
# 允许 except Exception 兜底降级（均须记录日志）
# 工具定义类：name/parameters/tags 为类级常量元数据（只读，不修改），属惯用模式
[tool.ruff.lint.per-file-ignores]
"src/data/akshare.py" = ["BLE001"]
"src/agent/pipeline_tools.py" = ["RUF012"]
"src/agent/rag_tools.py" = ["RUF012"]
"tests/**" = ["RUF012"]
