[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-robot"
version = "0.1.0"
description = "AI-powered stock analysis report assistant"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "akshare>=1.14",
    "pandas>=2.0",
    "jinja2>=3.1",
    "openai>=1.0",
    "anthropic>=0.30",
    "chromadb>=0.5",
]

[project.scripts]
stock-robot = "stock_robot.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "pytest-asyncio>=1.0",
]
