<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock Robot — AI 股票分析助手</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='4' fill='%23e5484d'/></svg>">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="topbar">
  <button class="mobile-nav-toggle" id="mobileNavToggle" type="button"
          aria-label="打开主要导航" aria-controls="sidebar" aria-expanded="false">☰</button>
  <div class="logo"><span class="dot"></span><span>Stock Robot</span></div>
  <h1 class="workspace-title" id="currentViewTitle">会话研究</h1>
  <form class="global-stock-search" role="search">
    <label class="sr-only" for="globalStockSearch">全局股票搜索</label>
    <div class="entry-input-wrap"><input id="globalStockSearch" inputmode="numeric" autocomplete="off" placeholder="搜索股票代码，如 600519"></div>
    <button id="globalStockSearchBtn" type="submit">分析</button>
  </form>
  <div class="conn-status" id="connStatus" role="status" hidden>⚠ 无法连接服务</div>
</header>
<button class="workspace-backdrop" id="workspaceBackdrop" type="button" hidden
        aria-label="关闭侧边栏或完整研报"></button>
<div class="layout" id="appLayout">
  <aside class="sidebar" id="sidebar" aria-label="会话列表">
    <div class="sidebar-top">
      <button class="new-session" id="newSessionBtn" type="button"><span class="plus">＋</span><span class="txt"> 新建会话</span></button>
      <button class="collapse-btn" id="collapseBtn" type="button" title="折叠/展开侧边栏" aria-label="折叠或展开侧边栏">«</button>
    </div>
    <div class="session-list" id="sessionList" aria-label="历史会话"></div>
    <nav class="nav" aria-label="主要导航">
      <button class="nav-item on" type="button" data-view="chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span>聊天</span>
      </button>
      <button class="nav-item" type="button" data-view="report">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 14l4-4 4 3 5-6"/></svg>
        <span>个股报告</span>
      </button>
      <button class="nav-item" type="button" data-view="index">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M23 6l-9.5 9.5-5-5L1 18"/><path d="M17 6h6v6"/></svg>
        <span>指数分析</span>
      </button>
      <button class="nav-item" type="button" data-view="subscriptions">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 22c5.5 0 10-4.5 10-10S17.5 2 12 2 2 6.5 2 12s4.5 10 10 10z"/><path d="M8 12h8"/><path d="M12 8v8"/></svg>
        <span>订阅推送</span>
      </button>
    </nav>
  </aside>
  <main class="main" id="workspaceMain" tabindex="-1">
    <div class="view active" id="view-chat">
      <div class="chat-scroll" id="chatScroll"></div>
      <div class="quick-bar">
        <button id="quickTiming" type="button">择时研判</button>
        <button id="quickTools" type="button">工具列表</button>
      </div>
      <div class="chat-input">
        <textarea id="chatInput" rows="2" placeholder="输入你的投资研究问题..."></textarea>
        <button id="sendBtn" type="button">发送</button>
      </div>
    </div>
    <div class="view" id="view-report">
      <div class="analysis-entry" aria-label="个股报告查询">
        <label for="stockInput">个股分析</label>
        <div class="analysis-entry-controls">
          <div class="entry-input-wrap"><input id="stockInput" inputmode="numeric" autocomplete="off" placeholder="输入股票代码，如 600519"></div>
          <button id="stockBtn" type="button">生成报告</button>
        </div>
      </div>
      <div id="reportContent" class="report-content"></div>
    </div>
    <div class="view" id="view-index">
      <div class="analysis-entry" aria-label="指数分析查询">
        <label for="indexInput">指数分析</label>
        <div class="analysis-entry-controls">
          <div class="entry-input-wrap"><input id="indexInput" autocomplete="off" placeholder="输入指数代码，空格分隔（000300 000905）"></div>
          <button id="indexBtn" type="button">生成分析</button>
        </div>
      </div>
      <div id="indexContent" class="report-content"></div>
    </div>
    <div class="view" id="view-subscriptions">
      <div class="subs-form panel">
        <div class="panel-title">新建订阅</div>
        <div class="subs-form-row">
          <input id="subName" placeholder="订阅名称（如：自选池）">
          <input id="subSymbols" placeholder="标的代码，空格分隔（600519 000300）">
          <select id="subKind"><option value="auto">自动判定</option><option value="stock">股票</option><option value="index">指数</option></select>
          <select id="subIndexStyle"><option value="">指数风格（自动）</option><option value="broad">宽基</option><option value="sector">行业</option><option value="overseas">海外</option></select>
          <select id="subChannel"><option value="email">邮箱（全文）</option><option value="wecom">企业微信（摘要）</option></select>
          <input id="subTime" type="time" value="08:00">
          <button id="subCreateBtn" type="button">创建</button>
        </div>
        <div class="subs-error" id="subsError"></div>
      </div>
      <div id="subsList"></div>
    </div>
  </main>
  <aside id="reportDrawer" role="dialog" aria-label="完整研报" aria-modal="false" aria-hidden="true" hidden>
    <div class="report-drawer-toolbar">
      <button id="reportDrawerRefresh" type="button">刷新</button>
      <button id="reportDrawerClose" type="button" aria-label="关闭完整研报">关闭</button>
    </div>
    <div id="reportDrawerError" role="status" hidden></div>
    <nav id="reportDrawerNav" aria-label="研报章节"></nav>
    <div id="reportDrawerContent"></div>
  </aside>
</div>
<script type="module" src="/js/app.js"></script>
</body>
</html>
