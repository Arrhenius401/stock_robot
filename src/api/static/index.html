<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock Robot — AI 股票分析助手</title>
<link rel="icon" type="image/png" href="/logo.png?v=2">
<link rel="stylesheet" href="/css/app.css?v=20260929-secret-status-2">
</head>
<body>
<header class="topbar">
  <button class="mobile-nav-toggle" id="mobileNavToggle" type="button"
          aria-label="打开主要导航" aria-controls="sidebar" aria-expanded="false">☰</button>
  <div class="logo"><img src="/logo.png?v=2" alt="" width="32" height="32"><span>Stock Robot</span></div>
  <div class="workspace-title" id="currentViewTitle">会话研究</div>
  <div class="conn-status" id="connStatus" role="status" hidden>⚠ 无法连接服务</div>
</header>
<button class="workspace-backdrop" id="workspaceBackdrop" type="button" hidden
        aria-label="关闭侧边栏或完整研报"></button>
<div class="layout" id="appLayout">
  <aside class="sidebar" id="sidebar" aria-label="会话列表">
    <div class="sidebar-top">
      <button class="new-session" id="newSessionBtn" type="button"><span class="plus">＋</span><span class="txt"> 新建会话</span></button>
      <button class="collapse-btn" id="collapseBtn" type="button" title="折叠/展开侧边栏" aria-label="折叠或展开侧边栏">«</button>
    </div>
    <div class="session-list" id="sessionList" aria-label="历史会话"></div>
    <nav class="nav" aria-label="主要导航">
      <button class="nav-item" type="button" data-view="report">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 14l4-4 4 3 5-6"/></svg>
        <span>股指分析</span>
      </button>
      <button class="nav-item" type="button" data-view="radar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3v4M21 12h-4M12 21v-4M3 12h4"/><path d="m12 12 5-3"/></svg>
        <span>配置雷达</span>
      </button>
      <button class="nav-item" type="button" data-view="report-library">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5z"/></svg>
        <span>报告库</span>
      </button>
      <button class="nav-item" type="button" data-view="subscriptions">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 22c5.5 0 10-4.5 10-10S17.5 2 12 2 2 6.5 2 12s4.5 10 10 10z"/><path d="M8 12h8"/><path d="M12 8v8"/></svg>
        <span>订阅推送</span>
      </button>
      <button class="nav-item" type="button" data-view="logs">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 5h16v14H4z"/><path d="m7 9 2 2-2 2M12 13h5"/></svg>
        <span>日志</span>
      </button>
      <button class="nav-item" type="button" data-view="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.1 2.1-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5v.2h-3v-.2a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1-2.1-2.1.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H5.3v-3h.2a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1 2.1-2.1.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.5v-.2h3v.2a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1 2.1 2.1-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.5 1h.2v3h-.2a1.7 1.7 0 0 0-1.5 1z"/></svg>
        <span>配置</span>
      </button>
    </nav>
  </aside>
  <div class="sidebar-resizer" id="sidebarResizer" role="separator" aria-orientation="vertical"
       aria-label="调整侧边栏宽度"></div>
  <main class="main" id="workspaceMain" tabindex="-1">
    <div class="view active" id="view-chat">
      <div class="chat-scroll" id="chatScroll"></div>
      <div class="quick-bar">
        <button id="quickTiming" type="button">择时研判</button>
        <button id="quickTools" type="button">工具列表</button>
      </div>
      <div class="chat-input">
        <textarea id="chatInput" rows="2" placeholder="输入你的投资研究问题..."></textarea>
        <button id="sendBtn" type="button">发送</button>
      </div>
    </div>
    <div class="view" id="view-report">
      <header class="page-heading"><div class="page-heading-copy"><h1>股指分析</h1><p>选择个股或指数，生成研究报告</p></div></header>
      <div class="analysis-entry analysis-entry-card" aria-label="股指分析查询">
        <div class="analysis-entry-label">研究对象</div>
        <div class="analysis-entry-row">
          <div class="analysis-kind" aria-label="研究对象">
            <button class="analysis-mode on" type="button" data-analysis-mode="report" aria-pressed="true">个股</button>
            <button class="analysis-mode" type="button" data-analysis-mode="index" aria-pressed="false">指数</button>
          </div>
          <div class="analysis-entry-controls">
            <div class="entry-input-wrap">
              <input id="stockInput" inputmode="numeric" autocomplete="off" aria-label="股票代码" placeholder="输入股票代码，如 600519">
              <div class="analysis-entry-hint">输入股票代码，生成个股研报</div>
            </div>
            <button id="stockBtn" type="button">生成研报</button>
          </div>
        </div>
      </div>
      <div id="reportContent" class="report-content"></div>
    </div>
    <div class="view" id="view-index">
      <header class="page-heading"><div class="page-heading-copy"><h1>股指分析</h1><p>选择个股或指数，生成研究报告</p></div></header>
      <div class="analysis-entry analysis-entry-card" aria-label="股指分析查询">
        <div class="analysis-entry-label">研究对象</div>
        <div class="analysis-entry-row">
          <div class="analysis-kind" aria-label="研究对象">
            <button class="analysis-mode" type="button" data-analysis-mode="report" aria-pressed="false">个股</button>
            <button class="analysis-mode on" type="button" data-analysis-mode="index" aria-pressed="true">指数</button>
          </div>
          <div class="analysis-entry-controls">
            <div class="entry-input-wrap">
              <input id="indexInput" autocomplete="off" aria-label="指数代码" placeholder="输入指数代码，空格分隔（000300 000905）">
              <div class="analysis-entry-hint">输入多个指数代码，用空格分隔</div>
            </div>
            <button id="indexBtn" type="button">生成研报</button>
          </div>
        </div>
      </div>
      <div id="indexContent" class="report-content"></div>
    </div>
    <div class="view" id="view-radar">
      <header class="page-heading"><div class="page-heading-copy"><h1>配置雷达</h1><p>查看 ETF 池快照与策略表现</p></div></header>
      <div id="radarContent" class="radar-content" aria-live="polite"></div>
    </div>
    <div class="view" id="view-report-library">
      <header class="page-heading"><div class="page-heading-copy"><h1>报告库</h1><p>浏览和管理已保存的报告</p></div></header>
      <div id="reportLibraryContent" class="report-library-content"></div>
    </div>
    <div class="view" id="view-subscriptions">
      <header class="page-heading"><div class="page-heading-copy"><h1>订阅推送</h1><p>每日自动发送研究报告到邮箱</p></div><div class="subs-heading-actions"><button id="subEmailBtn" type="button">邮箱设置</button><button id="subNewBtn" class="primary" type="button">新建订阅</button></div></header>
      <div class="subs-content"><div id="subsNotice" class="subs-notice" role="status" hidden></div><div id="subsList" aria-live="polite"></div><div id="subsDetail" hidden></div></div>
      <div id="subsModal" class="subs-modal" hidden>
        <div class="subs-modal-backdrop" data-close-modal></div>
        <section class="subs-modal-panel" role="dialog" aria-modal="true" aria-labelledby="subsModalTitle" tabindex="-1">
          <div class="subs-modal-head"><h2 id="subsModalTitle"></h2><button id="subsModalClose" type="button" aria-label="关闭弹窗">×</button></div>
          <div id="subsModalBody"></div>
        </section>
      </div>
    </div>
    <div class="view" id="view-logs">
      <header class="page-heading"><div class="page-heading-copy"><h1>日志</h1><p>仅显示本次服务启动后的记录，每 5 秒自动刷新</p></div><span class="logs-status" id="logsHeaderStatus" role="status">正在读取</span></header>
      <div id="logsContent" class="logs-content" aria-live="polite"></div>
    </div>
    <div class="view" id="view-settings">
      <header class="page-heading"><div class="page-heading-copy"><h1>配置</h1><p>调整应用与数据源设置</p></div></header>
      <div id="settingsContent" class="settings-content"></div>
    </div>
  </main>
  <aside id="reportDrawer" role="dialog" aria-label="完整研报" aria-modal="false" aria-hidden="true" hidden>
    <div class="report-drawer-toolbar">
      <button id="reportDrawerRefresh" type="button">刷新</button>
      <button id="reportDrawerClose" type="button" aria-label="关闭完整研报">关闭</button>
    </div>
    <div id="reportDrawerError" role="status" hidden></div>
    <nav id="reportDrawerNav" aria-label="研报章节"></nav>
    <div id="reportDrawerContent"></div>
  </aside>
</div>
    <script type="module" src="/js/app.js?v=20260929-secret-status-2"></script>
</body>
</html>
