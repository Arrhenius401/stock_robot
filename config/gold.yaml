# 黄金规则版本随计算口径变更更新，历史报告保留当时版本。
version: gold-v1
core_weight: 2
reference_weight: 1
main_window: 120
marginal_window: 60
rate_threshold_bp: 25
dollar_threshold_pct: 2
holdings_threshold_pct: 2
flat_slope_pct: 0.5
source_timeout_seconds: 30
total_timeout_seconds: 60
max_workers: 3
daily_cache_seconds: 21600
closed_cache_seconds: 86400
monthly_cache_seconds: 86400
historical_cache_seconds: 2592000
reserves_max_age_days: 90
